name: dump-mj-storeapi
on:
  workflow_dispatch:
jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and build
        run: bash dump.sh
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mj-storeapi-dump
          path: |
            out/
            pages/
          if-no-files-found: warn
